[project]
name = "qq-persona-bot"
version = "0.1.0"
description = "模仿指定人物聊天风格的 QQ 群机器人"
requires-python = ">=3.12"
dependencies = [
    "nonebot2[fastapi]>=2.3.0",
    "nonebot-adapter-onebot>=2.4.0",
    "httpx>=0.27.0",
]

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
plugins = ["src.plugins.qq_persona"]
